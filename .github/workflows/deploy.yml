name: Deploy PBMS to AWS EC2

on:
  push:
    branches:
      - deploy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'back-end/**'

            ai:
              - 'ai-services/**'

  deploy:
    needs: changes
    runs-on: ubuntu-latest

    steps:
