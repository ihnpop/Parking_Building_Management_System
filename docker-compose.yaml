services:
  back-end:
    build:
      context: ./back-end
    ports:
      - "3639:3636"
    environment:
      - OCR_SERVICE_URL=http://ai-service:8000
    volumes:
      - ./back-end:/app
      - /app/node_modules
    depends_on:
      - ai-service

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - back-end
    volumes:
      - ./frontend:/app
      - /app/node_modules

  ai-service:
    build: ./ai-services
    ports:
      - "8000:8000"
    restart: on-failure
