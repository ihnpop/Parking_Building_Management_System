<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Đăng nhập - ParkFlow</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2563EB",         /* Trả về màu xanh dương gốc */
              primaryHover: "#1D4ED8",    
              textMain: "#111827",
              secondary: "#6B7280",
              borderLight: "#E5E7EB",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .bg-blur-container {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url('https://i.postimg.cc/vmcMKhqj/Chat-GPT-Image-19-22-47-17-thg-6-2026.png');
        background-size: cover;
        background-position: center;
        filter: blur(20px) brightness(0.3);
        transform: scale(1.1);
      }

      .main-card {
        width: 88%;
        max-width: 1140px; /* Kéo rộng hai bên ra một chút để bớt trống */
        height: 82vh;
        min-height: 640px; /* Giữ cấu trúc thon dài, cao ráo */
        background: white;
        border-radius: 28px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6);
        display: flex;
        overflow: hidden;
      }

      .left-panel {
        width: 48%; /* Giữ tỷ lệ cân đối cho ảnh bên trái */
        height: 100%;
        padding: 14px;
      }

      .inner-visual {
        height: 100%;
        width: 100%;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        /* Phủ gradient xanh dương mờ tối để tiệp màu với tổng thể */
        background-image:
          linear-gradient(180deg, rgba(37, 99, 235, 0.1) 0%, rgba(17, 24, 39, 0.4) 50%, rgba(17, 24, 39, 0.85) 100%),
          url('https://i.postimg.cc/vmcMKhqj/Chat-GPT-Image-19-22-47-17-thg-6-2026.png');
        background-size: cover;
        background-position: center;
      }

      .right-panel {
        width: 52%;
        height: 100%;
        background: white;
        padding: 0 5rem; /* Điều chỉnh padding để form khít và đẹp hơn */
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .input-standard {
        height: 48px;
        border-radius: 10px;
        border: 1px solid #E5E7EB;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .input-standard:focus {
        border-color: #2563EB;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .btn-standard {
        height: 48px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="bg-blur-container"></div>

    <main class="main-card">
      <section class="left-panel">
        <div class="inner-visual flex flex-col justify-between p-12 select-none">
          <div>
            <span class="text-white font-extrabold tracking-widest text-sm opacity-90 uppercase">ParkFlow</span>
          </div>

          <div >
            <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
              <path />
            </svg>
          </div>

          <div class="text-white">
            <h1 class="text-3xl lg:text-4xl font-extrabold mb-5 tracking-tight leading-[1.15] uppercase">
              SMART PARKING<br>MANAGEMENT
            </h1>
            <p class="text-gray-300 text-sm max-w-sm leading-relaxed font-normal opacity-80">
              Hệ thống quản lý bãi đỗ xe thông minh giúp giám sát, vận hành và tối ưu hóa lưu lượng xe theo thời gian thực.
            </p>
          </div>
        </div>
      </section>
      <section class="right-panel">
        <div class="w-full max-w-md mx-auto">
          <header class="mb-8">
            <h2 class="text-3xl font-extrabold text-textMain mb-2 tracking-tight">
              CHÀO MỪNG QUAY LẠI !
            </h2>
            <p class="text-secondary text-sm font-normal opacity-80">
              Đăng nhập để tiếp tục quản lý hệ thống bãi đỗ xe.
            </p>
          </header>

          <form action="#" class="space-y-5" onsubmit="return false;">
            <div class="space-y-2">
              <label class="block text-sm font-semibold text-textMain" for="email">Email</label>
              <input
                class="input-standard w-full px-4 outline-none focus:ring-0 transition-all text-gray-800"
                id="email"
                placeholder="nhanvien@congty.vn"
                type="email"
              />
            </div>

            <div class="space-y-2">
              <div class="flex justify-between items-center">
                <label class="block text-sm font-semibold text-textMain" for="password">Mật khẩu</label>
                <a class="text-xs font-semibold text-primary hover:underline" href="#">
                  Quên mật khẩu?
                </a>
              </div>
              <div class="relative">
                <input
                  class="input-standard w-full px-4 pr-10 outline-none focus:ring-0 transition-all text-gray-800"
                  id="password"
                  placeholder="••••••••"
                  type="password"
                />
                <button
                  type="button"
                  id="togglePassword"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                >
                  <svg id="eyeIcon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="pt-4 space-y-3">
              <button
                id="loginBtn"
                class="btn-standard w-full bg-primary hover:bg-primaryHover text-white transition-all shadow-md shadow-blue-100"
                type="submit"
              >
                Đăng Nhập
              </button>
              
              <button
                class="btn-standard w-full border border-borderLight flex items-center justify-center space-x-3 text-textMain hover:bg-gray-50 bg-white transition-all"
                type="button"
              >
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                </svg>
                <span class="font-semibold text-sm text-gray-700">Đăng nhập với Google</span>
              </button>
            </div>
          </form>
        </div>
      </section>
      </main>

    <script>
      const passwordInput = document.getElementById("password");
      const togglePassword = document.getElementById("togglePassword");
      const eyeIcon = document.getElementById("eyeIcon");

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        
        if (isPassword) {
          eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
        } else {
          eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />`;
        }
      });
    </script>
  </body>
</html>
